<!DOCTYPE html>
<html lang="en">
<head>

 
    







 
    <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Capture</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 30px;
      background-color: #f4f4f9;
    }
    #webcam {
      display: none;
    }
    canvas {
      border: 2px solid #333;
      border-radius: 8px;
      background-color: #000;
      max-width: 100%;
    }
    .button-group {
      display: flex;
      gap: 12px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      border: none;
      color: white;
    }
    #capture-btn {
      background-color: #0070f3;
    }
    #save-btn {
      background-color: #10b981;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <h1>Document Capture</h1>

  <video id="webcam" autoplay playsinline></video>

  <canvas id="camera-canvas" width="640" height="480"></canvas>

  <div class="button-group">
    <button id="capture-btn" disabled>Take Photo</button>
    <button id="save-btn" class="hidden">Save & Send</button>
  </div>

  <script src="doc.js"></script>
</body>
</html>
